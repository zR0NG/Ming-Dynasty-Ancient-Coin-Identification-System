{% extends "base.html" %}
{% block content %}
    <!-- 导航栏选中态 -->
    <style>
        .navbar a[href="{{ url_for('classified') }}"] {
            background: #007bff; color: white; border-bottom: 2px solid #0056b3;
        }
    </style>

    <h2 class="page-title" style="text-align: center; font-size: 20px; font-weight: bold; margin: 20px 0;">已分类钱币查询</h2>

    <!-- 简化筛选区域 -->
    <div style="width: 80%; margin: 0 auto; padding: 15px; border: 1px solid #e0e0e0; border-radius: 4px; margin-bottom: 20px;">
        <form method="GET" style="display: flex; align-items: center; gap: 10px; justify-content: center;">
            <label for="class_filter" style="font-size: 14px; color: #333;">筛选类别：</label>
            <select id="class_filter" name="class" onchange="this.form.submit()"
                    style="padding: 6px; border-radius: 4px; border: 1px solid #ddd; font-size: 14px; width: 200px;">
                <option value="">所有类别</option>
                {% for cls in classes %}
                    <option value="{{ cls }}" {% if selected_class == cls %}selected{% endif %}>
                        {{ coin_info.get(cls, {}).年号|default('未知') }}通宝
                    </option>
                {% endfor %}
            </select>
        </form>
    </div>

    <!-- 分类图片展示（简化+完整信息） -->
    {% if classified_imgs %}
        <div style="width: 80%; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px;">
            {% for img in classified_imgs %}
                <div style="padding: 10px; border: 1px solid #eee; border-radius: 4px; text-align: center;">
                    <img src="{{ img.img_url }}" alt="{{ img.coin_info.年号 }}通宝"
                         style="width: 120px; height: 120px; object-fit: contain; margin-bottom: 8px;">
                    <!-- 完整信息 -->
                    <p style="font-size: 14px; font-weight: bold; margin-bottom: 5px;">{{ img.coin_info.年号 }}通宝</p>
                    <p style="font-size: 12px; color: #666; margin-bottom: 8px;">
                        年代：{{ img.coin_info.年代|default('未知') }}
                    </p>
                    <!-- 简化删除按钮 -->
                    <form method="POST" style="display: inline;">
                        <input type="hidden" name="img_url" value="{{ img.img_url }}">
                        <input type="hidden" name="action" value="delete">
                        <button type="submit" onclick="return confirm('确定删除？')"
                                style="background: #dc3545; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;">
                            删除
                        </button>
                    </form>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <!-- 空状态简化 -->
        <div style="width: 80%; margin: 0 auto; padding: 30px; border: 1px dashed #e0e0e0; border-radius: 4px; text-align: center;">
            <p style="font-size: 14px; color: #666;">暂无已分类的钱币，请先进行识别分类</p>
        </div>
    {% endif %}

    <footer style="text-align: center; font-size: 12px; color: #999; margin-top: 50px;">
        © 2025 明代古钱币智能识别系统 | 版权所有
    </footer>
{% endblock %}
